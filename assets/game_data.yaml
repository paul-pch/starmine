# Données de jeu (formules OGame classiques). Les formules sont dans lib/domain/rules.dart.
# Valeurs V1 marquées « à vérifier » : reprises de mémoire, sans source confirmée.
version: 3

start:
  resources: { metal: 500, crystal: 500, deuterium: 0 }
  temp_max: { min: -40, max: 80 }
  # Tmin = Tmax − temp_spread (affichage ; seule Tmax entre dans les formules).
  temp_spread: 40

# Groupes d'affichage (puces de filtre), dans l'ordre d'affichage.
categories:
  buildings:
    production: Production
    energy: Énergie
    storage: Stockage
    infrastructure: Infrastructure
  research:
    basic: Fondamentales
    combat: Combat
    propulsion: Propulsion
    advanced: Avancées
  defense:
    light: Légères
    heavy: Lourdes
    shields: Boucliers
  # Vaisseaux (V3a), affichés avec les défenses dans l'onglet Chantier.
  fleet:
    civil: Civils
    warships: Combat

# Coup de pouce de départ : production (base et mines) × (1 + extra × max(0, 1 − points /
# fade_points)), points d'économie et de recherche. ×3 au départ, disparaît à 500 points
# (mesuré : baisse de production bien plus douce qu'avec ×4 jusqu'à 100).
start_boost: { extra: 2, fade_points: 500 }

formulas:
  # N × growth^N, utilisé par la production, les consommations et l'énergie.
  growth: 1.1
  base_production_per_hour: { metal: 30, crystal: 15, deuterium: 0 }
  # Facteur deutérium = intercept + slope × Tmax.
  deuterium_temperature: { intercept: 1.44, slope: -0.004 }
  # Capacité = base × floor(multiplier × e^(exponent_numerator × N / exponent_denominator)).
  storage: { base: 5000, multiplier: 2.5, exponent_numerator: 20, exponent_denominator: 33 }
  # Construction (h) = (M + C) / (build_time_divisor × (1 + robots) × 2^nanites × vitesse).
  build_time_divisor: 2500
  # Recherche (h) = (M + C) / (research_time_divisor × (1 + labo) × vitesse).
  research_time_divisor: 1000

buildings:
  metal_mine:
    category: production
    name: Mine de métal
    description: Produit du métal. Consomme de l'énergie.
    cost: { metal: 60, crystal: 15 }
    factor: 1.5
    production: { resource: metal, coefficient: 30 }
    energy: { consumption: 10 }
  crystal_mine:
    category: production
    name: Mine de cristal
    description: Produit du cristal. Consomme de l'énergie.
    cost: { metal: 48, crystal: 24 }
    factor: 1.6
    production: { resource: crystal, coefficient: 20 }
    energy: { consumption: 10 }
  deuterium_synthesizer:
    category: production
    name: Synthétiseur de deutérium
    description: >-
      Produit du deutérium. Consomme beaucoup d'énergie. Rend davantage sur une planète
      froide.
    cost: { metal: 225, crystal: 75 }
    factor: 1.5
    production: { resource: deuterium, coefficient: 10 }
    energy: { consumption: 20 }
  solar_plant:
    category: energy
    name: Centrale solaire
    description: Produit l'énergie nécessaire aux mines.
    cost: { metal: 75, crystal: 30 }
    factor: 1.5
    energy: { production: 20 }
  fusion_reactor:
    category: energy
    name: Centrale à fusion
    description: >-
      Produit de l'énergie en brûlant du deutérium. La technologie Énergie augmente son
      rendement.
    # Coûts et facteur à vérifier.
    cost: { metal: 900, crystal: 360, deuterium: 180 }
    factor: 1.8
    requires: { deuterium_synthesizer: 5, energy_technology: 3 }
    # Énergie = 30 × N × (1.05 + 0.01 × Énergie)^N
    energy: { production: 30, growth: 1.05, growth_per_tech_level: { energy_technology: 0.01 } }
    # Deutérium consommé = 10 × N × 1.1^N par heure.
    consumption: { resource: deuterium, coefficient: 10 }
  metal_storage:
    category: storage
    name: Hangar de métal
    description: Augmente la capacité de stockage du métal.
    cost: { metal: 1000 }
    factor: 2
    stores: metal
  crystal_storage:
    category: storage
    name: Hangar de cristal
    description: Augmente la capacité de stockage du cristal.
    cost: { metal: 1000, crystal: 500 }
    factor: 2
    stores: crystal
  deuterium_tank:
    category: storage
    name: Réservoir de deutérium
    description: Augmente la capacité de stockage du deutérium.
    cost: { metal: 1000, crystal: 1000 }
    factor: 2
    stores: deuterium
  robotics_factory:
    category: infrastructure
    name: Usine de robots
    description: Accélère les constructions.
    cost: { metal: 400, crystal: 120, deuterium: 200 }
    factor: 2
  nanite_factory:
    category: infrastructure
    name: Usine de nanites
    description: Divise par deux la durée des constructions à chaque niveau.
    # Coûts à vérifier.
    cost: { metal: 1000000, crystal: 500000, deuterium: 100000 }
    factor: 2
    requires: { robotics_factory: 10, computer_technology: 10 }
  shipyard:
    category: infrastructure
    name: Chantier spatial
    description: >-
      Construit les défenses (et les vaisseaux en V3). Ses niveaux accélèrent la production.
      Ne peut pas être agrandi pendant qu'il produit.
    cost: { metal: 400, crystal: 200, deuterium: 100 }
    factor: 2
    requires: { robotics_factory: 2 }
  research_lab:
    category: infrastructure
    name: Laboratoire de recherche
    description: >-
      Permet les recherches et les accélère. Ne peut pas être agrandi pendant une
      recherche.
    # Coûts à vérifier.
    cost: { metal: 200, crystal: 400, deuterium: 200 }
    factor: 2

research:
  energy_technology:
    category: basic
    name: Technologie Énergie
    description: Prérequis de nombreuses technos. Augmente le rendement de la centrale à fusion.
    cost: { crystal: 800, deuterium: 400 }
    factor: 2
    requires: { research_lab: 1 }
  laser_technology:
    category: basic
    name: Technologie Laser
    description: Prérequis des technologies Ions et Plasma.
    cost: { metal: 200, crystal: 100 }
    factor: 2
    requires: { research_lab: 1, energy_technology: 2 }
  ion_technology:
    category: basic
    name: Technologie Ions
    description: Prérequis de la technologie Plasma.
    cost: { metal: 1000, crystal: 300, deuterium: 100 }
    factor: 2
    requires: { research_lab: 4, energy_technology: 4, laser_technology: 5 }
  plasma_technology:
    category: basic
    name: Technologie Plasma
    description: Augmente la production des mines à chaque niveau.
    cost: { metal: 2000, crystal: 4000, deuterium: 1000 }
    factor: 2
    requires: { research_lab: 4, energy_technology: 8, laser_technology: 10, ion_technology: 5 }
    # Bonus par niveau, à vérifier.
    production_bonus: { metal: 0.01, crystal: 0.0066, deuterium: 0.0033 }
  computer_technology:
    category: advanced
    name: Technologie Informatique
    description: >-
      Prérequis de l'usine de nanites. Chaque niveau ajoute une place de flotte (missions
      simultanées).
    cost: { crystal: 400, deuterium: 600 }
    factor: 2
    requires: { research_lab: 1 }
  weapons_technology:
    category: combat
    name: Technologie Armes
    description: Augmente l'attaque des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 800, crystal: 200 }
    factor: 2
    requires: { research_lab: 4 }
  shielding_technology:
    category: combat
    name: Technologie Bouclier
    description: Augmente les boucliers des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 200, crystal: 600 }
    factor: 2
    requires: { research_lab: 6, energy_technology: 3 }
  armour_technology:
    category: combat
    name: Technologie Protection
    description: Augmente la coque des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 1000 }
    factor: 2
    requires: { research_lab: 2 }
  # Propulsion (V3b) : chaque niveau accélère les vaisseaux qui utilisent ce réacteur.
  combustion_drive:
    category: propulsion
    name: Réacteur à combustion
    description: >-
      +10 % de vitesse par niveau pour les transporteurs, le chasseur léger, le recycleur et
      la sonde d'espionnage.
    cost: { metal: 400, deuterium: 600 }
    factor: 2
    requires: { energy_technology: 1 }
    drive_bonus: 0.1
  impulse_drive:
    category: propulsion
    name: Réacteur à impulsion
    description: +20 % de vitesse par niveau pour le chasseur lourd et le croiseur.
    cost: { metal: 2000, crystal: 4000, deuterium: 600 }
    factor: 2
    requires: { energy_technology: 1, research_lab: 2 }
    drive_bonus: 0.2
  hyperspace_drive:
    category: propulsion
    name: Propulsion hyperespace
    description: +30 % de vitesse par niveau pour le vaisseau de bataille.
    cost: { metal: 10000, crystal: 20000, deuterium: 6000 }
    factor: 2
    requires: { energy_technology: 5, shielding_technology: 5, research_lab: 7 }
    drive_bonus: 0.3
  espionage_technology:
    category: advanced
    name: Technologie Espionnage
    description: >-
      Détail des rapports d'espionnage : ressources dès le niveau 1, flotte au niveau 2,
      défenses au niveau 4, technologies au niveau 6.
    cost: { metal: 200, crystal: 1000, deuterium: 200 }
    factor: 2
    requires: { research_lab: 3 }

# Défenses (constructibles au chantier) et vaisseaux (pirates en V2).
# Coque = (M + C) / 10. Valeurs OGame classiques, à vérifier.
units:
  rocket_launcher:
    category: light
    name: Lanceur de missiles
    description: Défense de base, bon marché. Vulnérable au tir rapide des croiseurs.
    defense: true
    cost: { metal: 2000 }
    attack: 80
    shield: 20
    requires: { shipyard: 1 }
  light_laser:
    category: light
    name: Laser léger
    description: Défense légère, plus résistante que le lanceur de missiles.
    defense: true
    cost: { metal: 1500, crystal: 500 }
    attack: 100
    shield: 25
    requires: { shipyard: 2, energy_technology: 1, laser_technology: 3 }
  heavy_laser:
    category: heavy
    name: Laser lourd
    description: Défense intermédiaire polyvalente.
    defense: true
    cost: { metal: 6000, crystal: 2000 }
    attack: 250
    shield: 100
    requires: { shipyard: 4, energy_technology: 3, laser_technology: 6 }
  gauss_cannon:
    category: heavy
    name: Canon de Gauss
    description: Défense lourde, très efficace contre les gros vaisseaux.
    defense: true
    cost: { metal: 20000, crystal: 15000, deuterium: 2000 }
    attack: 1100
    shield: 200
    requires: { shipyard: 6, energy_technology: 6, weapons_technology: 3, shielding_technology: 1 }
  ion_cannon:
    category: heavy
    name: Artillerie à ions
    description: Défense au bouclier puissant, encaisse bien les petits tirs.
    defense: true
    cost: { metal: 5000, crystal: 3000 }
    attack: 150
    shield: 500
    requires: { shipyard: 4, ion_technology: 4 }
  plasma_turret:
    category: heavy
    name: Lanceur de plasma
    description: La défense la plus puissante.
    defense: true
    cost: { metal: 50000, crystal: 50000, deuterium: 30000 }
    attack: 3000
    shield: 300
    requires: { shipyard: 8, plasma_technology: 7 }
  small_shield_dome:
    category: shields
    name: Petit bouclier
    description: >-
      Dôme qui encaisse les tirs pendant le combat. Un seul par planète. Les tirs inférieurs
      à 1 % de son bouclier n'ont aucun effet.
    defense: true
    cost: { metal: 10000, crystal: 10000 }
    attack: 1
    shield: 2000
    max: 1
    requires: { shipyard: 1, shielding_technology: 2 }
  large_shield_dome:
    category: shields
    name: Grand bouclier
    description: Version renforcée du petit bouclier. Un seul par planète.
    defense: true
    cost: { metal: 50000, crystal: 50000 }
    attack: 1
    shield: 10000
    max: 1
    requires: { shipyard: 6, shielding_technology: 6 }
  small_cargo:
    category: civil
    description: >-
      Transporteur rapide et peu armé. Sa soute sert au pillage et aux livraisons (V3b).
    requires: { shipyard: 2, combustion_drive: 2 }
    speed: 5000
    fuel: 10
    drive: combustion_drive
    name: Petit transporteur
    cost: { metal: 2000, crystal: 2000 }
    attack: 5
    shield: 10
    cargo: 5000
  large_cargo:
    category: civil
    description: >-
      Grande soute, très peu armé.
    requires: { shipyard: 4, combustion_drive: 6 }
    speed: 7500
    fuel: 50
    drive: combustion_drive
    name: Grand transporteur
    cost: { metal: 6000, crystal: 6000 }
    attack: 5
    shield: 25
    cargo: 25000
  light_fighter:
    category: warships
    description: >-
      Chasseur bon marché, utile en nombre pour absorber les tirs.
    requires: { shipyard: 1, combustion_drive: 1 }
    speed: 12500
    fuel: 20
    drive: combustion_drive
    name: Chasseur léger
    cost: { metal: 3000, crystal: 1000 }
    attack: 50
    shield: 10
    cargo: 50
  heavy_fighter:
    category: warships
    description: >-
      Chasseur mieux armé et protégé ; tir rapide contre les petits transporteurs.
    requires: { shipyard: 3, armour_technology: 2, impulse_drive: 2 }
    speed: 10000
    fuel: 75
    drive: impulse_drive
    name: Chasseur lourd
    cost: { metal: 6000, crystal: 4000 }
    attack: 150
    shield: 25
    cargo: 100
    rapid_fire: { small_cargo: 3 }
  cruiser:
    category: warships
    description: >-
      Vaisseau rapide et puissant ; tir rapide contre les chasseurs légers et les lanceurs de missiles.
    requires: { shipyard: 5, impulse_drive: 4, ion_technology: 2 }
    speed: 15000
    fuel: 300
    drive: impulse_drive
    name: Croiseur
    cost: { metal: 20000, crystal: 7000, deuterium: 2000 }
    attack: 400
    shield: 50
    cargo: 800
    rapid_fire: { light_fighter: 6, rocket_launcher: 10 }
  battleship:
    category: warships
    description: >-
      Pilier de la flotte : forte attaque et grosse coque.
    requires: { shipyard: 7, hyperspace_drive: 4 }
    speed: 10000
    fuel: 500
    drive: hyperspace_drive
    name: Vaisseau de bataille
    cost: { metal: 45000, crystal: 15000 }
    attack: 1000
    shield: 200
    cargo: 1500
  recycler:
    category: civil
    name: Recycleur
    description: >-
      Collecte le champ de débris de la planète (métal et cristal des vaisseaux détruits).
      Peu armé : il vaut mieux le garder loin des combats.
    requires: { shipyard: 4, combustion_drive: 6, shielding_technology: 2 }
    cost: { metal: 10000, crystal: 6000, deuterium: 2000 }
    attack: 1
    shield: 10
    cargo: 20000
    speed: 2000
    fuel: 300
    drive: combustion_drive
  espionage_probe:
    category: civil
    name: Sonde d'espionnage
    description: >-
      Minuscule et ultra-rapide. Rapporte ce que contient une base pirate ; le détail dépend
      de la technologie Espionnage. Sans arme.
    requires: { shipyard: 3, combustion_drive: 3, espionage_technology: 2 }
    cost: { crystal: 1000 }
    attack: 0
    shield: 0
    cargo: 5
    speed: 100000000
    fuel: 1
    drive: combustion_drive

# Champ de débris (V3a) : part du métal et du cristal des vaisseaux détruits (des deux camps,
# défenses exclues) ; collecte par les recycleurs en un temps fixe (à ×1).
debris: { share: 0.3, collect_hours: 1 }

# Raids pirates (V2b). Durées à ×1, divisées par la vitesse de jeu.
pirates:
  # Délai entre deux arrivées, tiré uniformément : 2 à 3 raids par semaine à ×1. C'est aussi
  # le retard des pirates : leur force vient du relevé fait au raid précédent.
  interval_hours: { min: 48, max: 96 }
  # Milieu de partie : à partir de `points` points d'économie et de recherche (relevé), 1 à 2
  # raids par jour.
  late: { points: 200, interval_hours: { min: 12, max: 24 } }
  # La flotte est détectée (et sa composition fixée) ce délai avant son arrivée.
  warning_minutes: 60
  # Budget de la flotte (en ressources) = max(min_budget, points × 1000 × force),
  # force tirée dans la plage. Points d'économie et de recherche (sans les unités).
  # Plancher : 3 chasseurs légers.
  min_budget: 15000
  strength: { min: 0.15, max: 0.4 }
  # Part du budget consacrée aux transporteurs (capacité de pillage).
  cargo_share: 0.2
  # Pillage : part maximale de chaque stock, dans la limite de la soute.
  loot_share: 0.5
  # Technos Armes, Bouclier et Protection des pirates = celles du joueur au relevé, moins
  # ce décalage (plancher 0) : un cran sous le joueur qui recherche.
  tech_offset: 1
  # Vaisseaux de combat disponibles à partir de N points du joueur.
  warships: { light_fighter: 0, heavy_fighter: 50, cruiser: 200, battleship: 1000 }
  # Transporteur utilisé : le plus gros disponible.
  cargo_ships: { small_cargo: 0, large_cargo: 200 }

# Libellés des compteurs de progression (prérequis d'officiers).
counters:
  raids_repelled: Raids repoussés

# Officiers (spec 12) : gagnés en jouant, débloqués par le joueur quand les prérequis d'un
# niveau sont remplis. Bonus = per_level × niveau ; le plafond est le nombre de niveaux.
# Tous les officiers débloqués sont actifs. Option d'équilibrage pour plus tard : un nombre
# limité de places actives.
# Seuils à équilibrer en jouant (skill starmine-balance).
officers:
  geologist:
    name: Géologue
    description: >-
      Spécialiste des gisements. Chaque niveau augmente la production des mines de métal,
      de cristal et de deutérium. Se débloque en développant les mines.
    bonus: { type: mine_production, per_level: 0.05 }
    levels:
      - requires: { metal_mine: 5, crystal_mine: 4 }
      - requires: { metal_mine: 10, crystal_mine: 8, deuterium_synthesizer: 5 }
      - requires: { metal_mine: 14, crystal_mine: 12, deuterium_synthesizer: 9 }
      - requires: { metal_mine: 18, crystal_mine: 15, deuterium_synthesizer: 12 }
      - requires: { metal_mine: 22, crystal_mine: 19, deuterium_synthesizer: 16 }
  technocrat:
    name: Technocrate
    description: >-
      Scientifique en chef. Chaque niveau réduit la durée des recherches. Se débloque en
      agrandissant le laboratoire et en avançant dans l'arbre technologique.
    bonus: { type: research_time, per_level: 0.05 }
    levels:
      - requires: { research_lab: 2, energy_technology: 1 }
      - requires: { research_lab: 4, energy_technology: 4, computer_technology: 2 }
      - requires: { research_lab: 6, laser_technology: 5, computer_technology: 4 }
      - requires: { research_lab: 8, ion_technology: 4, computer_technology: 6 }
      - requires: { research_lab: 10, plasma_technology: 3, computer_technology: 8 }
  architect:
    name: Architecte
    description: >-
      Maître d'œuvre de la planète. Chaque niveau réduit la durée de construction des
      bâtiments. Se débloque avec l'usine de robots puis l'usine de nanites.
    bonus: { type: build_time, per_level: 0.05 }
    levels:
      - requires: { robotics_factory: 2 }
      - requires: { robotics_factory: 5 }
      - requires: { robotics_factory: 8 }
      - requires: { robotics_factory: 10, nanite_factory: 1 }
      - requires: { nanite_factory: 3 }
  engineer:
    name: Ingénieur
    description: >-
      Responsable des défenses. Chaque niveau augmente la part des défenses détruites
      reconstruites après un combat (70 % de base). Se débloque avec le chantier, la
      technologie Protection et les raids repoussés.
    bonus: { type: defense_rebuild, per_level: 0.03 }
    levels:
      - requires: { shipyard: 2, raids_repelled: 1 }
      - requires: { shipyard: 4, armour_technology: 2, raids_repelled: 3 }
      - requires: { shipyard: 6, armour_technology: 4, raids_repelled: 6 }
      - requires: { shipyard: 8, armour_technology: 6, raids_repelled: 10 }
      - requires: { shipyard: 10, armour_technology: 8, raids_repelled: 15 }
  # Files d'attente (spec 13) : un ordre de plus par niveau, un officier par file.
  commander:
    name: Commandant
    description: >-
      Chef des opérations de la planète. Chaque niveau ajoute un ordre à la file de
      construction : les bâtiments s'enchaînent sans attendre ton retour. Chaque ordre est
      payé à son démarrage ; s'il ne peut pas démarrer, toute la file est annulée.
    bonus: { type: construction_queue, per_level: 1 }
    levels:
      - requires: { robotics_factory: 3, metal_mine: 8 }
      - requires: { robotics_factory: 5, metal_mine: 12, crystal_mine: 10 }
      - requires: { robotics_factory: 8, metal_mine: 15, crystal_mine: 13 }
      - requires: { robotics_factory: 10, nanite_factory: 1 }
      - requires: { nanite_factory: 2 }
  research_director:
    name: Directeur scientifique
    description: >-
      Coordonne les équipes du laboratoire. Chaque niveau ajoute un ordre à la file de
      recherche. Chaque recherche est payée à son démarrage ; si elle ne peut pas démarrer,
      toute la file est annulée.
    bonus: { type: research_queue, per_level: 1 }
    levels:
      - requires: { research_lab: 3, energy_technology: 2 }
      - requires: { research_lab: 5, computer_technology: 3 }
      - requires: { research_lab: 7, computer_technology: 5 }
      - requires: { research_lab: 9, computer_technology: 7 }
      - requires: { research_lab: 12, computer_technology: 10 }
  shipyard_master:
    name: Chef de chantier
    description: >-
      Organise la production du chantier spatial. Chaque niveau ajoute un lot à la file du
      chantier. Chaque lot est payé à son démarrage ; s'il ne peut pas démarrer, toute la
      file est annulée.
    bonus: { type: shipyard_queue, per_level: 1 }
    levels:
      - requires: { shipyard: 2 }
      - requires: { shipyard: 4, robotics_factory: 4 }
      - requires: { shipyard: 6 }
      - requires: { shipyard: 8, nanite_factory: 1 }
      - requires: { shipyard: 10, nanite_factory: 2 }

# Événements ponctuels (spec 14). Une chaîne toujours planifiée ; à chaque tirage, sens
# positif ou négatif à parts égales (les choix comptent comme positifs), jamais deux malus
# actifs à la fois. Effets : production, energy (pendant hours), shorten (ordre en cours),
# stock, gain (heures de production à ×1), raid (heures d'avance du prochain raid).
# Officier lié : prolonge un bonus ou atténue un malus de per_level × niveau.
story_events:
  # Événements app ouverte seulement (spec 14). Le temps (ouvert ou fermé) remplit un stock :
  # un événement toutes les `interval_hours`, au plus `max_stock` en réserve.
  interval_hours: { min: 3, max: 5 }
  max_stock: 3
  # App ouverte : un événement du stock est servi, puis le suivant pas avant ce délai.
  serve_gap_minutes: { min: 20, max: 40 }
  # Délai pour répondre à un choix ; sans réponse, l'option par défaut s'applique.
  answer_hours: 6
  catalog:
    rich_vein:
      name: Filon riche
      kind: bonus
      description: >-
        Les foreuses ont percé une veine de métal d'une pureté rare. Les mines tournent à
        plein régime tant qu'elle n'est pas épuisée.
      requires: { metal_mine: 1 }
      effects: [{ type: production, resource: metal, value: 0.3, hours: 12 }]
      officer: { kind: geologist, per_level: 0.1 }
    deuterium_geyser:
      name: Geyser de deutérium
      kind: bonus
      description: >-
        Une poche d'eau lourde jaillit près du synthétiseur. Les équipes la captent avant
        qu'elle ne se tarisse.
      requires: { deuterium_synthesizer: 1 }
      effects: [{ type: production, resource: deuterium, value: 0.4, hours: 8 }]
      officer: { kind: geologist, per_level: 0.1 }
    gravity_anomaly:
      name: Anomalie gravitationnelle
      kind: bonus
      description: >-
        Au fond d'un cratère, des blocs de roche flottent immobiles, défiant la gravité. Les
        chercheurs y installent leurs capteurs : leurs mesures font avancer les travaux en cours.
      requires: { research_lab: 1 }
      effects: [{ type: shorten, target: research, value: 0.2 }]
      officer: { kind: technocrat, per_level: 0.1 }
    drifting_wreck:
      name: Épave à la dérive
      kind: bonus
      description: >-
        Un cargo abandonné passe en orbite basse. Ses soutes sont récupérées avant qu'il ne
        se consume dans l'atmosphère.
      effects:
        - { type: gain, resource: metal, hours: 4 }
        - { type: gain, resource: crystal, hours: 4 }
    solar_storm:
      name: Tempête solaire
      kind: malus
      description: >-
        Une éruption de l'étoile sature les capteurs et les lignes électriques. La production
        d'énergie chute le temps que la tempête passe.
      requires: { solar_plant: 1 }
      effects: [{ type: energy, value: -0.25, hours: 6 }]
      officer: { kind: engineer, per_level: 0.1 }
    gallery_collapse:
      name: Effondrement de galerie
      kind: malus
      description: >-
        Une galerie de la mine de cristal s'est effondrée. Les équipes dégagent les puits,
        la production tourne au ralenti.
      requires: { crystal_mine: 1 }
      effects: [{ type: production, resource: crystal, value: -0.5, hours: 8 }]
      officer: { kind: geologist, per_level: 0.1 }
    sabotage:
      name: Sabotage
      kind: malus
      description: >-
        Des agents pirates ont endommagé les échafaudages du chantier de construction. Il
        faut reprendre une partie du travail.
      effects: [{ type: shorten, target: construction, value: -0.25 }]
      officer: { kind: architect, per_level: 0.1 }
    storage_leak:
      name: Fuite de stockage
      kind: malus
      description: >-
        Une brèche dans un hangar laisse s'échapper une partie du métal entreposé avant que
        les équipes ne la colmatent.
      effects: [{ type: stock, resource: metal, value: -0.1 }]
    orbital_battle:
      name: Bataille en orbite proche
      kind: bonus
      description: >-
        Deux bandes pirates se sont affrontées au-dessus de la planète. Les carcasses
        dérivent en orbite basse : il n'y a plus qu'à envoyer les recycleurs.
      requires: { shipyard: 2 }
      effects: [{ type: debris, hours: 6 }]
    merchant_convoy:
      name: Convoi marchand
      kind: choice
      description: >-
        Un convoi de marchands indépendants propose d'échanger une partie de ton métal contre
        une cargaison de cristal.
      options:
        - label: Échanger
          effects:
            - { type: stock, resource: metal, value: -0.15 }
            - { type: gain, resource: crystal, hours: 8 }
        - label: Refuser
      default: 1
    escort_request:
      name: Escorte demandée
      kind: choice
      description: >-
        Un transporteur poursuivi par des pirates demande refuge. L'accueillir rapporte une
        belle récompense, mais attire les pirates plus tôt que prévu.
      options:
        - label: Accueillir
          effects:
            - { type: gain, resource: crystal, hours: 10 }
            - { type: raid, hours: 12 }
        - label: Refuser
      default: 1
    unstable_wreck:
      name: Épave instable
      kind: choice
      description: >-
        Un croiseur éventré tourne lentement autour de la lune. Ses soutes sont pleines, mais
        son réacteur fuit : la fouiller est un pari.
      requires: { shipyard: 2, metal_mine: 12 }
      options:
        - label: Fouiller
          effects:
            - type: gamble
              chance: 0.6
              win:
                - { type: gain, resource: metal, hours: 8 }
                - { type: gain, resource: crystal, hours: 8 }
              lose: [{ type: stock, resource: crystal, value: -0.1 }]
        - label: Laisser dériver
      default: 1
    pirate_deserters:
      name: Déserteurs pirates
      kind: choice
      description: >-
        Trois pilotes du Croc demandent l'asile avec leurs chasseurs. Leurs anciens
        camarades ne leur pardonneront pas, et sauront où les trouver.
      requires: { shipyard: 2 }
      options:
        - label: Accueillir
          effects:
            - { type: units, unit: light_fighter, value: 3 }
            - { type: raid, hours: 6 }
        - label: Refuser
      default: 1
    advance_contract:
      name: Contrat d'avance
      kind: choice
      description: >-
        Une guilde de fondeurs propose d'avancer une part de ton métal pour un lot de
        production livré demain, métal et cristal, avec intérêts.
      requires: { metal_mine: 12, crystal_mine: 10 }
      options:
        - label: Investir
          effects:
            - { type: stock, resource: metal, value: -0.1 }
            - { type: delayed, resource: metal, hours: 12, delay: 24 }
            - { type: delayed, resource: crystal, hours: 12, delay: 24 }
        - label: Décliner
      default: 1
    prospectors:
      name: Prospecteurs
      kind: choice
      description: >-
        Une équipe de prospecteurs cherche un financement en deutérium pour sonder un
        astéroïde voisin. S'ils trouvent un gisement, tu partages le butin.
      requires: { deuterium_synthesizer: 8 }
      options:
        - label: Financer
          effects:
            - type: gamble
              chance: 0.5
              win: [{ type: gain, hours: 10 }]
              lose: [{ type: stock, resource: deuterium, value: -0.15 }]
        - label: Refuser
      default: 1
    distress_signal:
      name: Signal de détresse
      kind: choice
      description: >-
        Un signal de détresse émane d'un convoi immobilisé. Le secourir peut rapporter des
        transporteurs reconnaissants, ou révéler ta position à ceux qui l'ont attaqué.
      requires: { shipyard: 4 }
      options:
        - label: Secourir
          effects:
            - type: gamble
              chance: 0.7
              win:
                - { type: units, unit: small_cargo, value: 2 }
                - { type: gain, resource: crystal, hours: 4 }
              lose: [{ type: raid, hours: 8 }]
        - label: Ignorer
      default: 1

# Flotte (V3b). Durée d'un trajet (s, ×1) = (10 + 35 000 / %vitesse × √(distance × 10 /
# vitesse)) × flight_factor ; distance = 2 700 + 95 × systèmes. Carburant d'un trajet =
# Σ nombre × fuel × distance / 35 000 × (%vitesse / 100 + 1)², aller et retour payés au départ.
fleet:
  flight_factor: 3
  # Places de flotte = base_slots + niveau de la technologie Informatique.
  base_slots: 1
  # Durées proposées pour la mise à l'abri (heures à ×1) ; carburant d'un aller-retour vers
  # la base la plus proche.
  shelter_hours: [1, 2, 4, 8, 12]

# Bases pirates (V3b) : unités d'une valeur de defense_hours de ta production (×1), plancher
# min_budget ; doctrine tirée à chaque génération (part de vaisseaux, types présents) : il
# faut espionner. Stock = stock_hours de ta production, régénéré en refill_hours ; défenses
# relevées rebuild_hours après un combat ; base détruite remplacée après respawn_hours.
# Dures à gagner, rentables avec la bonne flotte (mesuré : test/balance).
pirate_bases:
  loot_share: 0.5
  min_budget: 4000
  refill_hours: 24
  rebuild_hours: 12
  respawn_hours: 24
  # Défenses disponibles selon les points du joueur (seuil minimal).
  defenses: { rocket_launcher: 0, light_laser: 0, heavy_laser: 50, gauss_cannon: 200 }
  list:
    - { name: Avant-poste de Kessa, systems: 2, defense_hours: 6, stock_hours: 12 }
    - { name: Repaire du Croc, systems: 3, defense_hours: 15, stock_hours: 24 }
    - { name: Forteresse d'Ulvar, systems: 5, defense_hours: 38, stock_hours: 48 }
    - { name: Citadelle noire, systems: 6, defense_hours: 80, stock_hours: 96 }
