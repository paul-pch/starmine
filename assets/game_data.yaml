# Données de jeu (formules OGame classiques). Les formules sont dans lib/domain/rules.dart.
# Valeurs V1 marquées « à vérifier » : reprises de mémoire, sans source confirmée.
version: 3

start:
  resources: { metal: 500, crystal: 500, deuterium: 0 }
  temp_max: { min: -40, max: 80 }
  # Tmin = Tmax − temp_spread (affichage ; seule Tmax entre dans les formules).
  temp_spread: 40

# Groupes d'affichage (puces de filtre), dans l'ordre d'affichage.
categories:
  buildings:
    production: Production
    energy: Énergie
    storage: Stockage
    infrastructure: Infrastructure
  research:
    basic: Fondamentales
    combat: Combat
    advanced: Avancées
  defense:
    light: Légères
    heavy: Lourdes
    shields: Boucliers

formulas:
  # N × growth^N, utilisé par la production, les consommations et l'énergie.
  growth: 1.1
  base_production_per_hour: { metal: 30, crystal: 15, deuterium: 0 }
  # Facteur deutérium = intercept + slope × Tmax.
  deuterium_temperature: { intercept: 1.44, slope: -0.004 }
  # Capacité = base × floor(multiplier × e^(exponent_numerator × N / exponent_denominator)).
  storage: { base: 5000, multiplier: 2.5, exponent_numerator: 20, exponent_denominator: 33 }
  # Construction (h) = (M + C) / (build_time_divisor × (1 + robots) × 2^nanites × vitesse).
  build_time_divisor: 2500
  # Recherche (h) = (M + C) / (research_time_divisor × (1 + labo) × vitesse).
  research_time_divisor: 1000

buildings:
  metal_mine:
    category: production
    name: Mine de métal
    description: Produit du métal. Consomme de l'énergie.
    cost: { metal: 60, crystal: 15 }
    factor: 1.5
    production: { resource: metal, coefficient: 30 }
    energy: { consumption: 10 }
  crystal_mine:
    category: production
    name: Mine de cristal
    description: Produit du cristal. Consomme de l'énergie.
    cost: { metal: 48, crystal: 24 }
    factor: 1.6
    production: { resource: crystal, coefficient: 20 }
    energy: { consumption: 10 }
  deuterium_synthesizer:
    category: production
    name: Synthétiseur de deutérium
    description: >-
      Produit du deutérium. Consomme beaucoup d'énergie. Rend davantage sur une planète
      froide.
    cost: { metal: 225, crystal: 75 }
    factor: 1.5
    production: { resource: deuterium, coefficient: 10 }
    energy: { consumption: 20 }
  solar_plant:
    category: energy
    name: Centrale solaire
    description: Produit l'énergie nécessaire aux mines.
    cost: { metal: 75, crystal: 30 }
    factor: 1.5
    energy: { production: 20 }
  fusion_reactor:
    category: energy
    name: Centrale à fusion
    description: >-
      Produit de l'énergie en brûlant du deutérium. La technologie Énergie augmente son
      rendement.
    # Coûts et facteur à vérifier.
    cost: { metal: 900, crystal: 360, deuterium: 180 }
    factor: 1.8
    requires: { deuterium_synthesizer: 5, energy_technology: 3 }
    # Énergie = 30 × N × (1.05 + 0.01 × Énergie)^N
    energy: { production: 30, growth: 1.05, growth_per_tech_level: { energy_technology: 0.01 } }
    # Deutérium consommé = 10 × N × 1.1^N par heure.
    consumption: { resource: deuterium, coefficient: 10 }
  metal_storage:
    category: storage
    name: Hangar de métal
    description: Augmente la capacité de stockage du métal.
    cost: { metal: 1000 }
    factor: 2
    stores: metal
  crystal_storage:
    category: storage
    name: Hangar de cristal
    description: Augmente la capacité de stockage du cristal.
    cost: { metal: 1000, crystal: 500 }
    factor: 2
    stores: crystal
  deuterium_tank:
    category: storage
    name: Réservoir de deutérium
    description: Augmente la capacité de stockage du deutérium.
    cost: { metal: 1000, crystal: 1000 }
    factor: 2
    stores: deuterium
  robotics_factory:
    category: infrastructure
    name: Usine de robots
    description: Accélère les constructions.
    cost: { metal: 400, crystal: 120, deuterium: 200 }
    factor: 2
  nanite_factory:
    category: infrastructure
    name: Usine de nanites
    description: Divise par deux la durée des constructions à chaque niveau.
    # Coûts à vérifier.
    cost: { metal: 1000000, crystal: 500000, deuterium: 100000 }
    factor: 2
    requires: { robotics_factory: 10, computer_technology: 10 }
  shipyard:
    category: infrastructure
    name: Chantier spatial
    description: >-
      Construit les défenses (et les vaisseaux en V3). Ses niveaux accélèrent la production.
      Ne peut pas être agrandi pendant qu'il produit.
    cost: { metal: 400, crystal: 200, deuterium: 100 }
    factor: 2
    requires: { robotics_factory: 2 }
  research_lab:
    category: infrastructure
    name: Laboratoire de recherche
    description: >-
      Permet les recherches et les accélère. Ne peut pas être agrandi pendant une
      recherche.
    # Coûts à vérifier.
    cost: { metal: 200, crystal: 400, deuterium: 200 }
    factor: 2

research:
  energy_technology:
    category: basic
    name: Technologie Énergie
    description: Prérequis de nombreuses technos. Augmente le rendement de la centrale à fusion.
    cost: { crystal: 800, deuterium: 400 }
    factor: 2
    requires: { research_lab: 1 }
  laser_technology:
    category: basic
    name: Technologie Laser
    description: Prérequis des technologies Ions et Plasma.
    cost: { metal: 200, crystal: 100 }
    factor: 2
    requires: { research_lab: 1, energy_technology: 2 }
  ion_technology:
    category: basic
    name: Technologie Ions
    description: Prérequis de la technologie Plasma.
    cost: { metal: 1000, crystal: 300, deuterium: 100 }
    factor: 2
    requires: { research_lab: 4, energy_technology: 4, laser_technology: 5 }
  plasma_technology:
    category: basic
    name: Technologie Plasma
    description: Augmente la production des mines à chaque niveau.
    cost: { metal: 2000, crystal: 4000, deuterium: 1000 }
    factor: 2
    requires: { research_lab: 4, energy_technology: 8, laser_technology: 10, ion_technology: 5 }
    # Bonus par niveau, à vérifier.
    production_bonus: { metal: 0.01, crystal: 0.0066, deuterium: 0.0033 }
  computer_technology:
    category: advanced
    name: Technologie Informatique
    description: Prérequis de l'usine de nanites.
    cost: { crystal: 400, deuterium: 600 }
    factor: 2
    requires: { research_lab: 1 }
  weapons_technology:
    category: combat
    name: Technologie Armes
    description: Augmente l'attaque des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 800, crystal: 200 }
    factor: 2
    requires: { research_lab: 4 }
  shielding_technology:
    category: combat
    name: Technologie Bouclier
    description: Augmente les boucliers des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 200, crystal: 600 }
    factor: 2
    requires: { research_lab: 6, energy_technology: 3 }
  armour_technology:
    category: combat
    name: Technologie Protection
    description: Augmente la coque des défenses et vaisseaux de 10 % par niveau.
    cost: { metal: 1000 }
    factor: 2
    requires: { research_lab: 2 }

# Défenses (constructibles au chantier) et vaisseaux (pirates en V2).
# Coque = (M + C) / 10. Valeurs OGame classiques, à vérifier.
units:
  rocket_launcher:
    category: light
    name: Lanceur de missiles
    description: Défense de base, bon marché. Vulnérable au tir rapide des croiseurs.
    defense: true
    cost: { metal: 2000 }
    attack: 80
    shield: 20
    requires: { shipyard: 1 }
  light_laser:
    category: light
    name: Laser léger
    description: Défense légère, plus résistante que le lanceur de missiles.
    defense: true
    cost: { metal: 1500, crystal: 500 }
    attack: 100
    shield: 25
    requires: { shipyard: 2, energy_technology: 1, laser_technology: 3 }
  heavy_laser:
    category: heavy
    name: Laser lourd
    description: Défense intermédiaire polyvalente.
    defense: true
    cost: { metal: 6000, crystal: 2000 }
    attack: 250
    shield: 100
    requires: { shipyard: 4, energy_technology: 3, laser_technology: 6 }
  gauss_cannon:
    category: heavy
    name: Canon de Gauss
    description: Défense lourde, très efficace contre les gros vaisseaux.
    defense: true
    cost: { metal: 20000, crystal: 15000, deuterium: 2000 }
    attack: 1100
    shield: 200
    requires: { shipyard: 6, energy_technology: 6, weapons_technology: 3, shielding_technology: 1 }
  ion_cannon:
    category: heavy
    name: Artillerie à ions
    description: Défense au bouclier puissant, encaisse bien les petits tirs.
    defense: true
    cost: { metal: 5000, crystal: 3000 }
    attack: 150
    shield: 500
    requires: { shipyard: 4, ion_technology: 4 }
  plasma_turret:
    category: heavy
    name: Lanceur de plasma
    description: La défense la plus puissante.
    defense: true
    cost: { metal: 50000, crystal: 50000, deuterium: 30000 }
    attack: 3000
    shield: 300
    requires: { shipyard: 8, plasma_technology: 7 }
  small_shield_dome:
    category: shields
    name: Petit bouclier
    description: >-
      Dôme qui encaisse les tirs pendant le combat. Un seul par planète. Les tirs inférieurs
      à 1 % de son bouclier n'ont aucun effet.
    defense: true
    cost: { metal: 10000, crystal: 10000 }
    attack: 1
    shield: 2000
    max: 1
    requires: { shipyard: 1, shielding_technology: 2 }
  large_shield_dome:
    category: shields
    name: Grand bouclier
    description: Version renforcée du petit bouclier. Un seul par planète.
    defense: true
    cost: { metal: 50000, crystal: 50000 }
    attack: 1
    shield: 10000
    max: 1
    requires: { shipyard: 6, shielding_technology: 6 }
  small_cargo:
    name: Petit transporteur
    cost: { metal: 2000, crystal: 2000 }
    attack: 5
    shield: 10
    cargo: 5000
  large_cargo:
    name: Grand transporteur
    cost: { metal: 6000, crystal: 6000 }
    attack: 5
    shield: 25
    cargo: 25000
  light_fighter:
    name: Chasseur léger
    cost: { metal: 3000, crystal: 1000 }
    attack: 50
    shield: 10
    cargo: 50
  heavy_fighter:
    name: Chasseur lourd
    cost: { metal: 6000, crystal: 4000 }
    attack: 150
    shield: 25
    cargo: 100
    rapid_fire: { small_cargo: 3 }
  cruiser:
    name: Croiseur
    cost: { metal: 20000, crystal: 7000, deuterium: 2000 }
    attack: 400
    shield: 50
    cargo: 800
    rapid_fire: { light_fighter: 6, rocket_launcher: 10 }
  battleship:
    name: Vaisseau de bataille
    cost: { metal: 45000, crystal: 15000 }
    attack: 1000
    shield: 200
    cargo: 1500

# Raids pirates (V2b). Durées à ×1, divisées par la vitesse de jeu.
pirates:
  # Délai entre deux arrivées, tiré uniformément : 2 à 3 raids par semaine à ×1. C'est aussi
  # le retard des pirates : leur force vient du relevé fait au raid précédent.
  interval_hours: { min: 48, max: 96 }
  # La flotte est détectée (et sa composition fixée) ce délai avant son arrivée.
  warning_minutes: 60
  # Budget de la flotte (en ressources) = max(min_budget, points × 1000 × force),
  # force tirée dans la plage. Points d'économie et de recherche (sans les unités).
  # Plancher : 3 chasseurs légers.
  min_budget: 15000
  strength: { min: 0.15, max: 0.4 }
  # Part du budget consacrée aux transporteurs (capacité de pillage).
  cargo_share: 0.2
  # Pillage : part maximale de chaque stock, dans la limite de la soute.
  loot_share: 0.5
  # Technos Armes, Bouclier et Protection des pirates = celles du joueur au relevé, moins
  # ce décalage (plancher 0) : un cran sous le joueur qui recherche.
  tech_offset: 1
  # Vaisseaux de combat disponibles à partir de N points du joueur.
  warships: { light_fighter: 0, heavy_fighter: 50, cruiser: 200, battleship: 1000 }
  # Transporteur utilisé : le plus gros disponible.
  cargo_ships: { small_cargo: 0, large_cargo: 200 }
