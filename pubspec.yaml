name: starmine
description: "Idle solo façon OGame, en temps réel, pour Android."
publish_to: "none"

# versionName = 0.1.0 ; le versionCode (+N) est écrasé en CI par github.run_number.
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  # Version exacte lue par la CI (subosito/flutter-action, flutter-version-file).
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.3
  path_provider: ^2.1.6
  timezone: ^0.11.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/game_data.yaml
